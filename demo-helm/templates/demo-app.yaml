{{- if .Values.demoApp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ai-obs-demo.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-obs-demo.labels" . | nindent 4 }}
    {{- include "ai-obs-demo.selectorLabels" (dict "name" "demo-app" "root" .) | nindent 4 }}
spec:
  replicas: {{ .Values.demoApp.replicaCount }}
  selector:
    matchLabels:
      {{- include "ai-obs-demo.selectorLabels" (dict "name" "demo-app" "root" .) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ai-obs-demo.labels" . | nindent 8 }}
        {{- include "ai-obs-demo.selectorLabels" (dict "name" "demo-app" "root" .) | nindent 8 }}
      annotations:
        # Force pod restart when secrets change
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      containers:
        - name: demo-app
          image: "{{ .Values.demoApp.image.repository }}:{{ .Values.demoApp.image.tag }}"
          imagePullPolicy: {{ .Values.demoApp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LITELLM_URL
              value: {{ .Values.demoApp.env.LITELLM_URL | quote }}
            - name: LANGFUSE_URL
              value: {{ .Values.demoApp.env.LANGFUSE_URL | quote }}
            - name: FEATURE_FLAG_URL
              value: {{ .Values.demoApp.env.FEATURE_FLAG_URL | quote }}
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-obs-demo.langfuseSecretName" . }}
                  key: LANGFUSE_PUBLIC_KEY
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ai-obs-demo.langfuseSecretName" . }}
                  key: LANGFUSE_SECRET_KEY
            - name: LITELLM_KEY
              value: {{ .Values.litellm.config.general_settings.master_key | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ include "ai-obs-demo.fullname" . }}-alloy:4317"
            - name: NATS_URL
              value: "nats://{{ include "ai-obs-demo.fullname" . }}-nats:4222"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.demoApp.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-obs-demo.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-obs-demo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.demoApp.service.type }}
  ports:
    - port: {{ .Values.demoApp.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ai-obs-demo.selectorLabels" (dict "name" "demo-app" "root" .) | nindent 4 }}
{{- end }}
