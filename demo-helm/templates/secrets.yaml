{{- if not .Values.demoApp.langfuseExistingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-obs-demo.fullname" . }}-langfuse-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-obs-demo.labels" . | nindent 4 }}
type: Opaque
stringData:
  LANGFUSE_PUBLIC_KEY: {{ .Values.demoApp.langfuse.publicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.demoApp.langfuse.secretKey | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-obs-demo.tenantSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-obs-demo.labels" . | nindent 4 }}
type: Opaque
stringData:
  TENANT_A_API_KEY: {{ .Values.tenants.tenantA.apiKey | quote }}
  TENANT_B_API_KEY: {{ .Values.tenants.tenantB.apiKey | quote }}
  TENANT_C_API_KEY: {{ .Values.tenants.tenantC.apiKey | quote }}
  TENANT_D_API_KEY: {{ .Values.tenants.tenantD.apiKey | quote }}
{{- if and .Values.vllm.enabled .Values.vllm.hfToken (not .Values.vllm.hfTokenSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-obs-demo.fullname" . }}-hf-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ai-obs-demo.labels" . | nindent 4 }}
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.vllm.hfToken | quote }}
{{- end }}
